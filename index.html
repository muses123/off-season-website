  <script>
  // Update bag count on page load/ telle antall varer i bag
  function updateBagCount() {
    const cart = JSON.parse(localStorage.getItem('offseason-cart')) || [];
    const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    const bagCountElement = document.getElementById('bag-count');
    
    if (totalItems > 0) {
      bagCountElement.textContent = totalItems;
      bagCountElement.classList.add('show');
    } else {
      bagCountElement.classList.remove('show');
    }
  }
  updateBagCount();
</script>
